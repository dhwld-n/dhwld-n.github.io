<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인 버전 선택</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<style>
  :root { --bg:#0a0b1c; --surface:#14162d; --text:#e8eaf8; --muted:#a0a6d0; --accent:#6f8bff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; background:var(--bg); color:var(--text);
    font:400 17px/1.7 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif; word-break:keep-all;
    background-image:radial-gradient(60% 40% at 50% 0%, rgb(111 139 255 / .2), transparent 70%); }
  main { max-width:960px; margin:0 auto; padding:80px 24px; }
  h1 { margin:0 0 8px; font-size:clamp(28px,5vw,44px); letter-spacing:-.04em; }
  p.sub { margin:0 0 48px; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:24px;
    grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); }
  a.card { display:block; padding:28px; border-radius:24px; background:var(--surface); color:inherit; text-decoration:none;
    box-shadow:0 24px 48px -12px rgb(60 70 230 / .45), inset 0 -8px 16px rgb(4 5 30 / .7), inset 0 10px 24px rgb(150 170 255 / .22);
    transition:translate .35s cubic-bezier(.34,1.56,.64,1), scale .35s cubic-bezier(.34,1.56,.64,1); }
  a.card:hover { translate:0 -6px; scale:1.02; }
  a.card:active { scale:.97; }
  a.card:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  .tag { font:500 12px/1 ui-monospace,Menlo,monospace; letter-spacing:.14em; color:var(--accent); }
  h2 { margin:14px 0 6px; font-size:22px; letter-spacing:-.03em; }
  .card p { margin:0; color:var(--muted); font-size:15px; }
  @media (prefers-reduced-motion: reduce) { a.card { transition:none; } a.card:hover, a.card:active { translate:none; scale:none; } }
</style>
</head>
<body>
<main>
  <h1>디자인 버전 선택</h1>
  <p class="sub">같은 포트폴리오를 다른 디자인으로 만든 버전들이에요. 골라서 열어 보세요.</p>
  <ul>
    <!-- 새 버전을 만들면 design_N 폴더를 추가하고 여기에 li 한 줄을 더하면 된다 -->
    <li><a class="card" href="../"><span class="tag">MAIN</span><h2>메인 사이트</h2><p>지금 공개 중인 버전</p></a></li>
    <li><a class="card" href="../design_1/"><span class="tag">DESIGN 1</span><h2>Design 1</h2><p>사이드바 + 카드 레이아웃</p></a></li>
    <li><a class="card" href="../design_2/"><span class="tag">DESIGN 2</span><h2>Design 2 · 픽셀 스페이스</h2><p>픽셀 모서리, 별이 있는 검정 배경</p></a></li>
    <li><a class="card" href="../design_3/"><span class="tag">DESIGN 3</span><h2>Design 3 · 클레이 인디고</h2><p>파랑~보라, 입체 카드, 3D 히어로. 다크/라이트 전환</p></a></li>
  </ul>
</main>
</body>
</html>
